<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>paperclip viz</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; background: #0f1115; color: #ddd; }
  header { padding: 8px 14px; background: #181a20; border-bottom: 1px solid #2a2d36; position: sticky; top: 0; z-index: 10; }
  .top-row { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: 0.5px; }
  .conn { font-size: 11px; color: #888; }
  .conn .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; margin-right: 4px; vertical-align: middle; }
  .conn.live .dot { background: #4ade80; }
  .conn.dead .dot { background: #f87171; }
  .stats { display: flex; gap: 18px; font-size: 11px; align-items: baseline; flex-wrap: wrap; margin-left: auto; }
  .stats span.label { color: #888; }
  .stats span.value { color: #ddd; font-weight: 600; margin-left: 4px; }
  .stats span.value.cost { color: #c4b5fd; }
  .stats span.value.active { color: #4ade80; }
  .filter-row { margin-top: 6px; display: flex; gap: 10px; align-items: center; font-size: 11px; color: #888; flex-wrap: wrap; }
  .filter-row select { background: #0a0c11; border: 1px solid #2a2d36; color: #ddd; padding: 2px 6px; border-radius: 3px; font: inherit; font-size: 11px; }
  .filter-row .scope { color: #c4b5fd; }
  .filter-row .scope .clear { color: #888; cursor: pointer; margin-left: 4px; }
  .filter-row .scope .clear:hover { color: #f87171; }
  .col-toggle-btn { background: #0a0c11; border: 1px solid #2a2d36; color: #ddd; padding: 2px 8px; border-radius: 3px; font: inherit; font-size: 11px; cursor: pointer; }
  .col-toggle-btn:hover { border-color: #4a4d56; }
  .col-popover { position: absolute; top: 76px; right: 14px; background: #181a20; border: 1px solid #2a2d36; border-radius: 4px; padding: 8px 0; z-index: 20; display: none; min-width: 200px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
  .col-popover.open { display: block; }
  .col-popover label { display: flex; align-items: center; gap: 8px; padding: 4px 14px; font-size: 11px; color: #ddd; cursor: pointer; }
  .col-popover label:hover { background: #1c1f29; }
  .col-popover input { accent-color: #c4b5fd; }
  .col-popover .sep { border-top: 1px solid #2a2d36; margin: 4px 0; }
  .col-popover .head { padding: 4px 14px 6px; font-size: 9px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }

  main { display: grid; grid-template-columns: 280px 1fr 440px; height: calc(100vh - 76px); }

  /* sidebar */
  .sidebar { border-right: 1px solid #2a2d36; overflow: auto; background: #0c0e14; }
  .sb-section-title { padding: 8px 12px 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: #666; font-weight: 600; position: sticky; top: 0; background: #0c0e14; z-index: 1; }
  .session { padding: 8px 12px; border-bottom: 1px solid #1a1d24; cursor: pointer; }
  .session:hover { background: #14171f; }
  .session.selected { background: #1c2030; border-left: 2px solid #c4b5fd; padding-left: 10px; }
  .session .agent-line { display: flex; gap: 6px; align-items: center; font-size: 11px; color: #c4b5fd; margin-bottom: 2px; }
  .session .agent-line .agent-status { font-size: 9px; padding: 1px 5px; border-radius: 2px; background: #2a2d36; color: #aaa; text-transform: uppercase; }
  .session .agent-line .agent-status.running { background: #14532d; color: #4ade80; }
  .session .agent-line .agent-status.error,
  .session .agent-line .agent-status.failed { background: #4b1d1d; color: #f87171; }
  .session .preview { font-size: 11px; color: #ddd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.35; }
  .session .meta-line { font-size: 10px; color: #888; margin-top: 2px; display: flex; gap: 8px; align-items: center; }
  .session .sid { color: #666; font-family: ui-monospace, monospace; }
  .session .dot-active { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 4px #4ade80; animation: blink 1.4s ease-in-out infinite; }
  .session .err { color: #f87171; }
  .session .cost { color: #c4b5fd; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* center list */
  .list { overflow: auto; }
  .list-head, .row {
    display: grid;
    align-items: center;
    font-size: 12px;
    padding: 6px 14px;
    column-gap: 10px;
    border-bottom: 1px solid #1d1f26;
  }
  .list-head { font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: #666; font-weight: 600; background: #0c0e14; position: sticky; top: 0; z-index: 1; padding-top: 8px; padding-bottom: 8px; }
  .row { cursor: pointer; }
  .row:hover { background: #161821; }
  .row.selected { background: #1c1e29; }
  .row .time { color: #888; }
  .row .status.s-2 { color: #4ade80; }
  .row .status.s-4, .row .status.s-5 { color: #f87171; }
  .row .method { color: #60a5fa; }
  .row .path { color: #ddd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .row .path .model { color: #c4b5fd; margin-left: 8px; font-size: 11px; }
  .row .num { color: #888; font-size: 11px; text-align: right; }
  .row .blocks { font-size: 10px; }
  .blocks .block-tag { display: inline-block; padding: 0 4px; border-radius: 2px; margin-right: 2px; font-size: 9px; }
  .block-tag.t-text { background: #1f2937; color: #cbd5e1; }
  .block-tag.t-tool_use { background: #312e81; color: #c4b5fd; }
  .block-tag.t-tool_result { background: #14532d; color: #86efac; }
  .block-tag.t-thinking { background: #581c87; color: #d8b4fe; }
  .block-tag.t-image, .block-tag.t-document { background: #422006; color: #fbbf24; }
  .row .delta { font-size: 11px; text-align: right; }
  .row .delta.plus { color: #fbbf24; }
  .row .delta.minus { color: #4ade80; }
  .row .delta.zero { color: #555; }
  .row .session-short { color: #c4b5fd; font-family: ui-monospace, monospace; font-size: 10px; }
  .row .agent-short { color: #c4b5fd; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .snippet { color: #bbb; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; line-height: 1.4; }
  /* Per-column alignment — applied by JS via inline style to header AND cell */
  .row > *, .list-head > * { overflow: hidden; }

  /* json tree */
  .jt { font-size: 11px; line-height: 1.5; font-family: ui-monospace, monospace; }
  .jt details { margin: 0; }
  .jt summary { cursor: pointer; user-select: none; list-style: none; padding: 1px 0; }
  .jt summary::-webkit-details-marker { display: none; }
  .jt summary::before { content: "▶"; display: inline-block; width: 1em; color: #555; font-size: 9px; transition: transform 0.1s; }
  .jt details[open] > summary::before { transform: rotate(90deg); }
  .jt .jt-row { padding-left: 14px; }
  .jt .jt-key { color: #c4b5fd; }
  .jt .jt-type { color: #555; font-size: 10px; margin-left: 4px; }
  .jt .jt-string { color: #86efac; white-space: pre-wrap; word-break: break-word; }
  .jt .jt-number { color: #fbbf24; }
  .jt .jt-bool { color: #60a5fa; }
  .jt .jt-null { color: #888; font-style: italic; }
  .jt .jt-empty { color: #555; }
  .jt .jt-blocktype { color: #c4b5fd; font-weight: 600; }
  .jt .jt-clip { color: #666; font-style: italic; font-size: 10px; }
  .jt-flat { padding-left: 14px; }
  .row .new-pulse { animation: pulse 1.4s ease-out 1; }
  @keyframes pulse { 0% { background: #1f3a2a; } 100% { background: transparent; } }
  .empty-list { padding: 40px; text-align: center; color: #555; font-size: 12px; }

  /* detail panel */
  .detail { border-left: 1px solid #2a2d36; overflow: auto; background: #0c0e14; padding: 14px 18px; }
  .detail .empty { color: #555; text-align: center; padding: 60px 20px; font-size: 12px; }
  .detail h2 { font-size: 12px; margin: 0 0 8px; color: #aaa; font-weight: 600; letter-spacing: 0.3px; }
  .detail h3 { margin: 18px 0 6px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.6px; color: #888; font-weight: 600; }
  .detail h3:first-of-type { margin-top: 8px; }
  .detail pre { background: #06080c; padding: 10px 12px; border-radius: 4px; overflow: auto; max-height: 360px; font-size: 11px; margin: 0; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .detail .meta { font-size: 11px; color: #888; }
  .detail .meta b { color: #ddd; font-weight: 600; }
  .detail .sid-link { color: #c4b5fd; cursor: pointer; }
  .detail .sid-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <div class="top-row">
    <h1>paperclip viz</h1>
    <span class="conn" id="conn"><span class="dot"></span><span id="conn-text">connecting…</span></span>
    <div class="stats" id="stats">
      <span><span class="label">active</span><span class="value active" id="s-active">—</span></span>
      <span><span class="label">sessions</span><span class="value" id="s-sessions">—</span></span>
      <span><span class="label">exchanges</span><span class="value" id="s-count">—</span></span>
      <span><span class="label">in</span><span class="value" id="s-input">—</span></span>
      <span><span class="label">out</span><span class="value" id="s-output">—</span></span>
      <span><span class="label">cR</span><span class="value" id="s-cread">—</span></span>
      <span><span class="label">cW</span><span class="value" id="s-cwrite">—</span></span>
      <span><span class="label">est cost</span><span class="value cost" id="s-cost">—</span></span>
    </div>
  </div>
  <div class="filter-row">
    <label for="range-select">window</label>
    <select id="range-select">
      <option value="10m">10m</option>
      <option value="1h">1h</option>
      <option value="6h">6h</option>
      <option value="24h" selected>24h</option>
      <option value="3d">3d</option>
      <option value="7d">7d</option>
      <option value="all">all</option>
    </select>
    <span id="scope-display"></span>
    <button class="col-toggle-btn" id="col-toggle-btn" style="margin-left:auto">columns ▾</button>
  </div>
  <div class="col-popover" id="col-popover">
    <div class="head">show columns</div>
    <div id="col-list"></div>
  </div>
</header>
<main>
  <aside class="sidebar">
    <div class="sb-section-title">sessions</div>
    <div id="sessions-list"></div>
  </aside>
  <div class="list" id="list-wrap">
    <div class="list-head" id="list-head"></div>
    <div id="list"></div>
  </div>
  <aside class="detail" id="detail"><div class="empty">select an exchange</div></aside>
</main>

<script>
// ---------- column definitions ----------
// align: 'left' | 'right' — applied to BOTH header and cell so they line up.
// width: any valid CSS grid track size.
const COLUMNS = [
  { key: 'time',     label: 'time',     width: '88px',  align: 'left', on: true,
    render: e => `<span class="time">${fmt.time(e.ts)}</span>` },
  { key: 'status',   label: 'st',       width: '40px',  align: 'left', on: true,
    render: e => `<span class="status ${statusClass(e.status)}">${e.status ?? '—'}</span>` },
  { key: 'method',   label: 'method',   width: '70px',  align: 'left', on: true,
    render: e => `<span class="method">${escapeHtml(e.method || '')}${e.streaming ? ' <span style="color:#888;font-size:9px">SSE</span>' : ''}</span>` },
  { key: 'path',     label: 'path / model', width: '1fr', align: 'left', on: true,
    render: e => `<span class="path">${escapeHtml(e.path || '')}<span class="model">${escapeHtml(e.model || '')}</span></span>` },
  { key: 'sent',     label: 'sent (new user turn)', width: '1.4fr', align: 'left', on: true,
    render: e => `<span class="snippet">${escapeHtml(e.req_summary || '—')}</span>` },
  { key: 'received', label: 'received (assistant)', width: '1.4fr', align: 'left', on: true,
    render: e => `<span class="snippet">${escapeHtml(e.resp_summary || '—')}</span>` },
  { key: 'tokens',   label: 'in / out', width: '120px', align: 'right', on: true,
    render: e => `<span class="num">${e.input_tokens != null ? fmt.tokens(e.input_tokens) + ' in' : ''} ${e.output_tokens != null ? '/ ' + fmt.tokens(e.output_tokens) + ' out' : ''}</span>` },
  { key: 'duration', label: 'dur',      width: '60px',  align: 'right', on: true,
    render: e => `<span class="num">${fmt.duration(e.duration_ms)}</span>` },
  // off by default — user can opt in
  { key: 'context',  label: 'ctx',      width: '70px',  align: 'right', on: false,
    render: e => { const v = (e.input_tokens||0)+(e.cache_read_tokens||0)+(e.cache_creation_tokens||0); return `<span class="num">${v ? fmt.tokens(v) : '—'}</span>`; } },
  { key: 'delta',    label: 'Δ ctx',    width: '70px',  align: 'right', on: true,
    // context_delta is computed server-side via SQL LAG() per session.
    render: e => {
      const d = e.context_delta;
      if (d == null) return `<span class="delta zero">—</span>`;
      const cls = d > 0 ? 'plus' : (d < 0 ? 'minus' : 'zero');
      const sign = d > 0 ? '+' : '';
      return `<span class="delta ${cls}">${sign}${fmt.tokens(d)}</span>`;
    } },
  { key: 'cache_pct', label: 'cache %', width: '60px',  align: 'right', on: false,
    render: e => {
      const r = e.cache_read_tokens || 0;
      const tot = (e.input_tokens||0) + r + (e.cache_creation_tokens||0);
      if (!tot) return `<span class="num">—</span>`;
      return `<span class="num">${Math.round(r / tot * 100)}%</span>`;
    } },
  { key: 'req_blocks',  label: 'req blocks',  width: '120px', align: 'left', on: false,
    render: e => `<span class="blocks">${(e.req_block_types || []).map(t => `<span class="block-tag t-${t}">${t}</span>`).join('')}</span>` },
  { key: 'resp_blocks', label: 'resp blocks', width: '120px', align: 'left', on: false,
    render: e => `<span class="blocks">${(e.resp_block_types || []).map(t => `<span class="block-tag t-${t}">${t}</span>`).join('')}</span>` },
  { key: 'session_short', label: 'session', width: '70px', align: 'left', on: false,
    render: e => `<span class="session-short">${e.session_id ? e.session_id.slice(0,8) : '—'}</span>` },
];

const $list = document.getElementById('list');
const $listHead = document.getElementById('list-head');
const $listWrap = document.getElementById('list-wrap');
const $detail = document.getElementById('detail');
const $sessions = document.getElementById('sessions-list');
const $conn = document.getElementById('conn');
const $connText = document.getElementById('conn-text');
const $range = document.getElementById('range-select');
const $scope = document.getElementById('scope-display');
const $colBtn = document.getElementById('col-toggle-btn');
const $colPop = document.getElementById('col-popover');
const $colList = document.getElementById('col-list');

const state = {
  range: '24h',
  selectedSessionId: null,
  selectedExchangeId: null,
  cols: loadColumnPrefs(),
  exchanges: [], // current rendered exchanges (for delta computation)
};
const renderedExchangeIds = new Set();
const sessionMap = new Map();

const fmt = {
  tokens(n) { if (n == null) return '—'; const a = Math.abs(n); if (a >= 1_000_000) return (n/1_000_000).toFixed(1) + 'M'; if (a >= 1000) return (n/1000).toFixed(1) + 'k'; return String(n); },
  time(ts) { try { return new Date(ts).toLocaleTimeString(); } catch { return ts; } },
  age(ts) { if (!ts) return '—'; const s = (Date.now() - new Date(ts).getTime())/1000; if (s < 60) return Math.floor(s) + 's'; if (s < 3600) return Math.floor(s/60) + 'm'; if (s < 86400) return Math.floor(s/3600) + 'h'; return Math.floor(s/86400) + 'd'; },
  duration(ms) { return ms == null ? '—' : (ms < 1000 ? ms + 'ms' : (ms/1000).toFixed(1) + 's'); },
  cost(v) { return v == null ? '—' : '$' + v.toFixed(v < 1 ? 3 : 2); },
};
function statusClass(s) { return s ? 's-' + String(s)[0] : ''; }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---------- JSON tree (collapsible) ----------
const JSON_STRING_CLIP = 4000;  // per-string max before we show a "[…N chars]" tail

// Decide whether a node should be open by default.
// Rule: open if this node IS or LIVES INSIDE a content-block array
// (`messages`, `content`). Everything else (system, tools, metadata, etc.) is
// collapsed so the right pane stays readable.
function jsonShouldOpen(key, path) {
  if (key === 'messages' || key === 'content') return true;
  // path is the chain of keys above THIS node.
  // open when an ancestor is 'messages' or 'content' — that pre-expands every
  // message dict, its content array, and every block dict within.
  for (const seg of path) {
    if (seg === 'messages' || seg === 'content') return true;
  }
  return false;
}

function renderJsonValue(value, keyLabel, path) {
  if (value === null) return `<span class="jt-null">null</span>`;
  const t = typeof value;
  if (t === 'string') {
    let s = value;
    let tail = '';
    if (s.length > JSON_STRING_CLIP) {
      tail = `<span class="jt-clip"> […${(s.length - JSON_STRING_CLIP).toLocaleString()} chars]</span>`;
      s = s.slice(0, JSON_STRING_CLIP);
    }
    return `<span class="jt-string">"${escapeHtml(s)}"</span>${tail}`;
  }
  if (t === 'number')  return `<span class="jt-number">${value}</span>`;
  if (t === 'boolean') return `<span class="jt-bool">${value}</span>`;
  if (Array.isArray(value)) return renderJsonArray(value, keyLabel, path);
  if (t === 'object')  return renderJsonObject(value, keyLabel, path);
  return escapeHtml(String(value));
}

function renderJsonArray(arr, keyLabel, path) {
  if (arr.length === 0) return `<span class="jt-empty">[]</span>`;
  const open = jsonShouldOpen(keyLabel, path);
  const inner = arr.map((v, i) => {
    // For content-block arrays, surface the block type in the row label so
    // you can scan tool_use / text / tool_result without expanding each one.
    let blockHint = '';
    if (v && typeof v === 'object' && !Array.isArray(v) && typeof v.type === 'string'
        && (keyLabel === 'content' || keyLabel === 'messages')) {
      blockHint = ` <span class="jt-blocktype">${escapeHtml(v.type)}${v.name ? ': ' + escapeHtml(v.name) : ''}</span>`;
    }
    return `<div class="jt-row"><span class="jt-key">[${i}]</span>${blockHint} ${renderJsonValue(v, String(i), [...path, keyLabel])}</div>`;
  }).join('');
  return `<details ${open ? 'open' : ''}><summary><span class="jt-type">[${arr.length}]</span></summary>${inner}</details>`;
}

function renderJsonObject(obj, keyLabel, path) {
  const keys = Object.keys(obj);
  if (keys.length === 0) return `<span class="jt-empty">{}</span>`;
  const open = jsonShouldOpen(keyLabel, path);
  const inner = keys.map(k => {
    return `<div class="jt-row"><span class="jt-key">${escapeHtml(k)}:</span> ${renderJsonValue(obj[k], k, [...path, keyLabel])}</div>`;
  }).join('');
  // For objects we still want a compact summary line — show first few keys.
  const hint = keys.length <= 4 ? keys.join(', ') : keys.slice(0, 3).join(', ') + ', …';
  return `<details ${open ? 'open' : ''}><summary><span class="jt-type">{${keys.length}}</span> <span class="jt-clip">${escapeHtml(hint)}</span></summary>${inner}</details>`;
}

function renderJsonTree(value) {
  if (value === null || value === undefined) return `<div class="jt-flat jt-null">null</div>`;
  if (typeof value !== 'object') return `<div class="jt-flat">${renderJsonValue(value, '', [])}</div>`;
  return `<div class="jt">${renderJsonValue(value, '', [])}</div>`;
}

// ---------- column prefs (localStorage) ----------
function loadColumnPrefs() {
  try {
    const raw = localStorage.getItem('viz.cols');
    const parsed = raw ? JSON.parse(raw) : null;
    const out = {};
    COLUMNS.forEach(c => { out[c.key] = (parsed && c.key in parsed) ? !!parsed[c.key] : c.on; });
    return out;
  } catch { const o = {}; COLUMNS.forEach(c => o[c.key] = c.on); return o; }
}
function saveColumnPrefs() { localStorage.setItem('viz.cols', JSON.stringify(state.cols)); }
function activeColumns() { return COLUMNS.filter(c => state.cols[c.key]); }
function gridTemplate() { return activeColumns().map(c => c.width).join(' '); }

function renderColTogglePopover() {
  $colList.innerHTML = COLUMNS.map(c => `<label><input type="checkbox" data-key="${c.key}" ${state.cols[c.key] ? 'checked' : ''}> ${escapeHtml(c.label)}</label>`).join('');
  $colList.querySelectorAll('input').forEach(input => {
    input.addEventListener('change', () => {
      state.cols[input.dataset.key] = input.checked;
      saveColumnPrefs();
      renderListLayout();
      reloadExchanges();
    });
  });
}
$colBtn.addEventListener('click', e => { e.stopPropagation(); $colPop.classList.toggle('open'); });
document.addEventListener('click', e => {
  if (!$colPop.contains(e.target) && e.target !== $colBtn) $colPop.classList.remove('open');
});

function renderListLayout() {
  const tpl = gridTemplate();
  $listHead.style.gridTemplateColumns = tpl;
  $listHead.innerHTML = activeColumns()
    .map(c => `<span style="text-align:${c.align}">${escapeHtml(c.label)}</span>`)
    .join('');
}

// ---------- sessions sidebar ----------
function renderSessions(data) {
  sessionMap.clear();
  data.sessions.forEach(s => sessionMap.set(s.session_id, s));
  $sessions.innerHTML = data.sessions.map(s => sessionHtml(s)).join('') || '<div class="empty-list">no sessions</div>';
  if (state.selectedSessionId) {
    const el = $sessions.querySelector(`[data-sid="${state.selectedSessionId}"]`);
    if (el) el.classList.add('selected');
  }
}
function agentLine(s) {
  if (!s.paperclip) return '';
  const p = s.paperclip;
  const label = p.agent_name || (p.agent_id ? p.agent_id.slice(0,8) : '?');
  const statusCls = p.status === 'running' ? 'running' : (p.status === 'error' || p.error_code ? 'error' : '');
  return `<div class="agent-line">
    <span>${escapeHtml(label)}</span>
    <span class="agent-status ${statusCls}">${escapeHtml(p.status || '?')}</span>
    ${p.invocation_source ? `<span style="color:#666;font-size:9px">${escapeHtml(p.invocation_source)}</span>` : ''}
  </div>`;
}
function sessionHtml(s) {
  const errs = s.error_count > 0 ? `<span class="err">${s.error_count} err</span>` : '';
  const active = s.active ? '<span class="dot-active" title="active"></span>' : '';
  const cost = s.estimated_cost_usd != null ? `<span class="cost">${fmt.cost(s.estimated_cost_usd)}</span>` : '';
  return `<div class="session" data-sid="${s.session_id}">
    ${agentLine(s)}
    <div class="preview">${escapeHtml(s.prompt_preview || '(no prompt)')}</div>
    <div class="meta-line">
      ${active}
      <span class="sid">${s.session_id.slice(0,8)}</span>
      <span>${s.exchange_count} ex</span>
      <span>${fmt.tokens(s.input_tokens + s.cache_read_tokens + s.cache_creation_tokens)} ctx</span>
      ${cost}
      ${errs}
      <span style="margin-left:auto">${fmt.age(s.last_ts)} ago</span>
    </div>
  </div>`;
}
$sessions.addEventListener('click', e => {
  const node = e.target.closest('.session');
  if (!node) return;
  const sid = node.dataset.sid;
  state.selectedSessionId = (state.selectedSessionId === sid) ? null : sid;
  $sessions.querySelectorAll('.session').forEach(n => n.classList.toggle('selected', n.dataset.sid === state.selectedSessionId));
  updateScope();
  reloadExchanges();
});

function updateScope() {
  if (state.selectedSessionId) {
    const s = sessionMap.get(state.selectedSessionId);
    const preview = s ? (s.prompt_preview || s.session_id.slice(0,8)) : state.selectedSessionId.slice(0,8);
    $scope.innerHTML = `· scope <span class="scope">${escapeHtml(preview).slice(0,50)} <span class="clear" id="clear-scope">×</span></span>`;
    document.getElementById('clear-scope').addEventListener('click', () => {
      state.selectedSessionId = null;
      $sessions.querySelectorAll('.session').forEach(n => n.classList.remove('selected'));
      updateScope();
      reloadExchanges();
    });
  } else {
    $scope.textContent = '';
  }
}

// ---------- exchange list ----------
function rowHtml(e, isNew) {
  const cells = activeColumns()
    .map(c => `<span style="text-align:${c.align}">${c.render(e)}</span>`)
    .join('');
  return `<div class="row${isNew ? ' new-pulse' : ''}${e.id === state.selectedExchangeId ? ' selected' : ''}" data-id="${e.id}" data-sid="${e.session_id || ''}" style="grid-template-columns:${gridTemplate()}">${cells}</div>`;
}
function renderExchanges(exchanges) {
  renderedExchangeIds.clear();
  state.exchanges = exchanges;
  if (!exchanges.length) {
    $list.innerHTML = '<div class="empty-list">no exchanges in window</div>';
    return;
  }
  $list.innerHTML = exchanges.map(e => { renderedExchangeIds.add(e.id); return rowHtml(e, false); }).join('');
}
function prependRow(e) {
  if (state.selectedSessionId && e.session_id !== state.selectedSessionId) return;
  if (renderedExchangeIds.has(e.id)) return;
  renderedExchangeIds.add(e.id);
  // SSE event carries no context_delta — refetch the page so the column fills.
  // Debounced via scheduleReload to avoid thrashing on rapid bursts.
  scheduleReload();
}
$list.addEventListener('click', e => {
  const row = e.target.closest('.row');
  if (row) loadDetail(row.dataset.id);
});

async function reloadExchanges() {
  const params = new URLSearchParams({ limit: '500', range: state.range });
  if (state.selectedSessionId) params.set('session_id', state.selectedSessionId);
  const r = await fetch('/api/exchanges?' + params);
  const j = await r.json();
  renderExchanges(j.exchanges);
}

// ---------- detail ----------
function renderDetail(record) {
  const req = record.request || {};
  const resp = record.response || {};
  const usage = record.usage || {};
  const sid = record.session_id;

  // Request body: prefer parsed JSON tree; fall back to raw text.
  const reqBodyHtml = req.body_json != null
    ? renderJsonTree(req.body_json)
    : `<pre>${escapeHtml(req.body_text || '(empty)')}</pre>`;

  // Response body: prefer parsed JSON tree. If it's a streaming response the
  // proxy only has assistant_text + body_text; show the reconstructed text in a
  // pre for readability.
  let respBodyHtml;
  if (resp.body_json != null) {
    respBodyHtml = renderJsonTree(resp.body_json);
  } else if (resp.assistant_text) {
    respBodyHtml = `<pre>${escapeHtml(resp.assistant_text)}</pre>`;
  } else {
    respBodyHtml = `<pre>${escapeHtml(resp.body_text || '(empty)')}</pre>`;
  }

  $detail.innerHTML = `
    <h2>${escapeHtml(record.method)} ${escapeHtml(record.path)}</h2>
    <div class="meta">
      <b>${escapeHtml(record.model || '—')}</b> · ${record.streaming ? 'stream' : 'buffered'} ·
      status <b>${record.status ?? '—'}</b> · <b>${fmt.duration(record.duration_ms)}</b> · ${escapeHtml(record.ts)}
    </div>
    <div class="meta" style="margin-top:4px">
      session: ${sid ? `<span class="sid-link" data-sid="${sid}">${sid}</span>` : '<span style="color:#555">none</span>'}
    </div>
    <div class="meta" style="margin-top:4px">
      tokens: in <b>${fmt.tokens(usage.in)}</b> · out <b>${fmt.tokens(usage.out)}</b> ·
      cache read <b>${fmt.tokens(usage.cache_read)}</b> · cache write <b>${fmt.tokens(usage.cache_create)}</b>
    </div>
    ${record.error ? `<h3>error</h3><pre>${escapeHtml(record.error)}</pre>` : ''}
    <h3>request headers</h3>${renderJsonTree(req.headers || {})}
    <h3>request body</h3>${reqBodyHtml}
    <h3>response headers</h3>${renderJsonTree(resp.headers || {})}
    <h3>response body</h3>${respBodyHtml}
  `;
  const sidLink = $detail.querySelector('.sid-link');
  if (sidLink) sidLink.addEventListener('click', () => {
    state.selectedSessionId = sidLink.dataset.sid;
    $sessions.querySelectorAll('.session').forEach(n => n.classList.toggle('selected', n.dataset.sid === state.selectedSessionId));
    updateScope();
    reloadExchanges();
  });
}
async function loadDetail(id) {
  state.selectedExchangeId = id;
  document.querySelectorAll('.row').forEach(r => r.classList.toggle('selected', r.dataset.id === id));
  try {
    const r = await fetch('/api/exchanges/' + encodeURIComponent(id));
    if (!r.ok) throw new Error('fetch ' + r.status);
    renderDetail(await r.json());
  } catch (e) {
    $detail.innerHTML = `<div class="empty">error: ${escapeHtml(String(e))}</div>`;
  }
}

// ---------- stats ----------
async function refreshStats() {
  try {
    const [statsR, sessR] = await Promise.all([
      fetch('/api/stats?range=' + encodeURIComponent(state.range)),
      fetch('/api/sessions?range=' + encodeURIComponent(state.range) + '&limit=200'),
    ]);
    if (statsR.ok) {
      const s = await statsR.json();
      document.getElementById('s-count').textContent = s.total_exchanges;
      document.getElementById('s-input').textContent = fmt.tokens(s.totals.input_tokens);
      document.getElementById('s-output').textContent = fmt.tokens(s.totals.output_tokens);
      document.getElementById('s-cread').textContent = fmt.tokens(s.totals.cache_read_tokens);
      document.getElementById('s-cwrite').textContent = fmt.tokens(s.totals.cache_creation_tokens);
      document.getElementById('s-cost').textContent = fmt.cost(s.estimated_total_cost_usd);
    }
    if (sessR.ok) {
      const d = await sessR.json();
      document.getElementById('s-active').textContent = d.active_count;
      document.getElementById('s-sessions').textContent = d.count;
      renderSessions(d);
    }
  } catch {}
}

// ---------- range ----------
$range.addEventListener('change', () => { state.range = $range.value; refreshStats(); reloadExchanges(); });

// ---------- SSE ----------
function connectSSE() {
  const es = new EventSource('/api/events');
  es.addEventListener('hello', () => { $conn.className = 'conn live'; $connText.textContent = 'live'; });
  es.addEventListener('exchange', ev => {
    try {
      const e = JSON.parse(ev.data);
      prependRow(e);
      scheduleStatsRefresh();
    } catch {}
  });
  es.onerror = () => {
    $conn.className = 'conn dead'; $connText.textContent = 'reconnecting…';
    es.close();
    setTimeout(connectSSE, 2000);
  };
}
let _statsTimer = null;
function scheduleStatsRefresh() {
  if (_statsTimer) return;
  _statsTimer = setTimeout(() => { _statsTimer = null; refreshStats(); }, 400);
}
let _reloadTimer = null;
function scheduleReload() {
  if (_reloadTimer) return;
  _reloadTimer = setTimeout(() => { _reloadTimer = null; reloadExchanges(); scheduleStatsRefresh(); }, 500);
}

// ---------- boot ----------
async function boot() {
  renderColTogglePopover();
  renderListLayout();
  await refreshStats();
  await reloadExchanges();
  connectSSE();
  setInterval(refreshStats, 8000);
}
boot();
</script>
</body>
</html>
